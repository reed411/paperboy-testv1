<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Paperboy Anime Roguelike</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #87CEEB; }
    
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .card {
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: bold;
      color: #2c3e50;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .controls {
      pointer-events: auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    .btn-col { display: flex; flex-direction: column; gap: 8px; }
    .btn-row { display: flex; gap: 8px; }

    button {
      pointer-events: auto;
      padding: 12px 16px;
      border-radius: 20px;
      border: 2px solid #fff;
      background: #2ec4b6;
      color: white;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
      cursor: pointer;
    }
    button:active { transform: scale(0.95); }

    .btn-pedal { background: #ff9f1c; padding: 16px 20px; font-size: 15px; }
    .btn-throw { background: #e71d36; padding: 16px 20px; font-size: 15px; }

    #logConsole {
      position: absolute;
      top: 70px;
      left: 16px;
      right: 16px;
      height: 180px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #38bdf8;
      border-radius: 10px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 11px;
      padding: 10px;
      overflow-y: auto;
      display: none;
      z-index: 20;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <div class="hud">
      <div class="card">❤️ HP: <span id="hp">3</span> | ⭐ <span id="score">00000</span></div>
      <div class="card">🚴 <span id="rpm">0</span> RPM</div>
    </div>

    <div class="controls">
      <div class="btn-col">
        <button onclick="connectBLE()">🚲 CONNECT SENSOR</button>
        <button onclick="toggleLogs()">📋 BLE LOGS</button>
      </div>
      <div class="btn-row">
        <button class="btn-pedal" onclick="manualPedal()">PEDAL</button>
        <button class="btn-throw" onclick="throwPaper()">THROW</button>
      </div>
    </div>
  </div>

  <div id="logConsole">
    <div>> Debug Console Ready.</div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const logConsole = document.getElementById('logConsole');

      let hp = 3, score = 0, rpm = 60, distance = 0; // Default to 60 RPM
      let lastHouseSpawnTime = performance.now();

      // Audio synth
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playTone(freq, duration = 0.1) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }

      let houses = [];
      let papers = [];

      function spawnHouse() {
        const side = Math.random() > 0.5 ? 'right' : 'left';
        houses.push({
          z: 1000,
          side: side,
          delivered: false,
          color: side === 'right' ? '#f4a261' : '#e76f51'
        });
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function log(msg) {
        const line = document.createElement('div');
        line.innerText = '> ' + msg;
        logConsole.appendChild(line);
        logConsole.scrollTop = logConsole.scrollHeight;
      }

      window.toggleLogs = function() {
        logConsole.style.display = logConsole.style.display === 'block' ? 'none' : 'block';
      };

      window.manualPedal = function() {
        rpm = Math.min(140, rpm + 10);
        playTone(200 + rpm * 2, 0.05);
      };

      window.throwPaper = function() {
        playTone(500, 0.1);
        papers.push({
          x: canvas.width / 2,
          y: canvas.height - 80,
          vx: (Math.random() - 0.5) * 8 + (houses.length > 0 && houses[0].side === 'right' ? 8 : -8),
          vy: -12,
          life: 30
        });

        const target = houses.find(h => h.z < 300 && h.z > 50 && !h.delivered);
        if (target) {
          target.delivered = true;
          score += 250;
          document.getElementById('score').innerText = String(score).padStart(5, '0');
          playTone(880, 0.2);
        }
      };

      window.connectBLE = async function() {
        log('Starting Bluetooth scan...');
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ['cycling_speed_and_cadence']
          });
          log('Device selected: ' + device.name);
          const server = await device.gatt.connect();
          log('Connected to GATT Server.');
          const service = await server.getPrimaryService('cycling_speed_and_cadence');
          const char = await service.getCharacteristic('csc_measurement');
          await char.startNotifications();
          log('Subscribed to RPM data!');

          let lastCrankRevs = null, lastCrankTime = null;
          char.addEventListener('characteristicvaluechanged', (e) => {
            const val = e.target.value;
            const flags = val.getUint8(0);
            if (flags & 0x02) {
              const crankRevs = val.getUint16(1, true);
              const crankTime = val.getUint16(3, true);
              if (lastCrankTime !== null) {
                let revDiff = crankRevs - lastCrankRevs;
                let timeDiff = (crankTime - lastCrankTime) / 1024;
                if (revDiff < 0) revDiff += 65536;
                if (timeDiff < 0) timeDiff += 64;
                if (timeDiff > 0) rpm = Math.round((revDiff / timeDiff) * 60);
              }
              lastCrankRevs = crankRevs;
              lastCrankTime = crankTime;
            }
          });
        } catch (err) {
          log('BLE Error: ' + err.message);
        }
      };

      // Decay loop
      setInterval(() => {
        rpm = Math.max(0, rpm - 1);
        document.getElementById('rpm').innerText = Math.round(rpm);
      }, 500);

      // Render Loop
      function render() {
        const speed = rpm * 0.15;
        distance += speed;

        const now = performance.now();
        // Dynamic interval: exactly 5000ms (5 seconds) when RPM is 60. Scales inversely with current RPM.
        const targetSpawnInterval = rpm > 0 ? (300, 300000 / rpm) : Infinity;

        if (now - lastHouseSpawnTime >= targetSpawnInterval && rpm > 0) {
          spawnHouse();
          lastHouseSpawnTime = now;
        }

        // Sky
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(0, 0, canvas.width, canvas.height * 0.45);

        // Grass
        ctx.fillStyle = '#94d2bd';
        ctx.fillRect(0, canvas.height * 0.45, canvas.width, canvas.height * 0.55);

        // Road
        const roadTopY = canvas.height * 0.45;
        ctx.fillStyle = '#e9d8a6';
        ctx.beginPath();
        ctx.moveTo(canvas.width * 0.48, roadTopY);
        ctx.lineTo(canvas.width * 0.52, roadTopY);
        ctx.lineTo(canvas.width * 0.85, canvas.height);
        ctx.lineTo(canvas.width * 0.15, canvas.height);
        ctx.fill();

        // Road Lines
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.setLineDash([20, 20]);
        ctx.lineDashOffset = -distance % 40;
        ctx.moveTo(canvas.width * 0.5, roadTopY);
        ctx.lineTo(canvas.width * 0.5, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        // Render & Move Houses
        for (let i = houses.length - 1; i >= 0; i--) {
          let h = houses[i];
          h.z -= speed * 12 + 2;

          if (h.z <= 0) {
            houses.splice(i, 1);
            continue;
          }

          let scale = 1 - (h.z / 1000);
          if (scale < 0.1) continue;

          let houseY = roadTopY + (canvas.height - roadTopY) * scale;
          let roadWidthAtY = (canvas.width * 0.7) * scale;
          let houseX = h.side === 'right' 
            ? (canvas.width / 2) + (roadWidthAtY / 2) + (40 * scale)
            : (canvas.width / 2) - (roadWidthAtY / 2) - (120 * scale);

          let width = 80 * scale;
          let height = 60 * scale;

          ctx.fillStyle = h.delivered ? '#2ec4b6' : h.color;
          ctx.fillRect(houseX, houseY - height, width, height);

          ctx.fillStyle = '#264653';
          ctx.beginPath();
          ctx.moveTo(houseX - 5 * scale, houseY - height);
          ctx.lineTo(houseX + width / 2, houseY - height - (30 * scale));
          ctx.lineTo(houseX + width + 5 * scale, houseY - height);
          ctx.fill();

          ctx.fillStyle = h.delivered ? '#ffb703' : '#e71d36';
          let mbX = h.side === 'right' ? houseX - (15 * scale) : houseX + width + (5 * scale);
          ctx.fillRect(mbX, houseY - (25 * scale), 12 * scale, 20 * scale);
        }

        // Render Newspapers
        for (let i = papers.length - 1; i >= 0; i--) {
          let p = papers[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life--;

          ctx.fillStyle = '#ffffff';
          ctx.fillRect(p.x, p.y, 12, 8);

          if (p.life <= 0) papers.splice(i, 1);
        }

        requestAnimationFrame(render);
      }

      render();
    });
  </script>
</body>
</html>
