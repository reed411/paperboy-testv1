<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Turbo Paperboy 16</title>
  <style>
    * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Courier New', monospace; background: #000; }
    
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #240046;
    }

    .ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      z-index: 10;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .card {
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #00ffff;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: bold;
      color: #00ffff;
      font-size: 14px;
      text-shadow: 2px 2px #000;
      box-shadow: 0 0 10px rgba(0,255,255,0.4);
    }

    .controls {
      pointer-events: auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    button {
      pointer-events: auto;
      padding: 14px 20px;
      border-radius: 8px;
      border: 2px solid #fff;
      background: #7928ca;
      color: white;
      font-weight: bold;
      font-size: 14px;
      font-family: 'Courier New', monospace;
      box-shadow: 0 4px 0 #3a125c;
      cursor: pointer;
    }
    button:active { transform: translateY(4px); box-shadow: 0 0 0 #3a125c; }
    .btn-pedal { background: #ff0055; box-shadow: 0 4px 0 #88002d; font-size: 16px; padding: 18px 28px; }

    .modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      z-index: 100;
      color: #00ffff;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 20px;
    }
    .modal h1 { color: #ff0055; font-size: 28px; margin-bottom: 15px; text-shadow: 3px 3px #000; }
    .modal p { font-size: 16px; margin: 8px 0; color: #fff; }
    .modal button { margin-top: 20px; background: #00ffff; color: #000; border: 2px solid #fff; font-size: 16px; }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <div class="hud">
      <div class="card">❤️ <span id="hp">3</span> | ⭐ <span id="score">00000</span><br>⏱️ <span id="timer">60</span>s</div>
      <div class="card">🚴 <span id="rpm">50</span> RPM<br><span id="powerupStatus" style="color:#ff00ff"></span></div>
    </div>

    <div class="controls">
      <button onclick="connectBLE()">🚲 SENSOR</button>
      <button class="btn-pedal" onclick="manualPedal()">PEDAL</button>
    </div>
  </div>

  <div id="recapModal" class="modal">
    <h1>ROUTE COMPLETE!</h1>
    <p>Final Score: <span id="finalScore">0</span></p>
    <p>Deliveries Hit: <span id="finalHits">0</span> / <span id="finalTotal">0</span></p>
    <p>Accuracy: <span id="finalAccuracy">0%</span></p>
    <button onclick="restartGame()">RIDE AGAIN</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Set fixed virtual resolution for clean rendering on all screens
    canvas.width = 800;
    canvas.height = 600;

    let score = 0, rpm = 50, distance = 0;
    let gameTime = 60;
    let gameOver = false;
    let totalHousesSpawned = 0;
    let successfulHits = 0;

    let homingCharges = 0;
    let doublePointsTimer = 0;

    let isAiming = false;
    let startTouch = { x: 0, y: 0 };
    let currentTouch = { x: 0, y: 0 };

    // Built-in Chiptune Music Engine
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let musicInterval = null;

    function startMusic() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (musicInterval) return;

      const notes = [220, 246.94, 261.63, 293.66, 329.63, 349.23, 392.00, 440];
      let step = 0;
      musicInterval = setInterval(() => {
        if (gameOver) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = notes[step % notes.length];
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
        step++;
      }, 200);
    }

    window.addEventListener('pointerdown', () => startMusic(), { once: true });

    function playSFX(freq, type = 'square', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    let houses = [];
    let papers = [];
    let powerups = [];

    window.manualPedal = function() {
      startMusic();
      rpm = Math.min(120, rpm + 20);
      playSFX(440, 'square', 0.05);
    };

    // Screen mapping helper for touch input
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (gameOver) return;
      isAiming = true;
      let pos = getCanvasCoords(e);
      startTouch = { x: pos.x, y: pos.y };
      currentTouch = { x: pos.x, y: pos.y };
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isAiming) return;
      let pos = getCanvasCoords(e);
      currentTouch = { x: pos.x, y: pos.y };
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!isAiming || gameOver) return;
      isAiming = false;
      let dx = currentTouch.x - startTouch.x;
      let dy = currentTouch.y - startTouch.y;
      throwPaper(dx, dy);
    });

    function throwPaper(dx, dy) {
      playSFX(880, 'square', 0.12);
      let isHoming = homingCharges > 0;
      if (isHoming) homingCharges--;

      papers.push({
        x: canvas.width / 2,
        y: canvas.height - 80,
        vx: dx * 0.15,
        vy: dy * 0.15 - 6,
        homing: isHoming,
        life: 50
      });
    }

    window.connectBLE = async function() {
      startMusic();
      try {
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['cycling_speed_and_cadence']
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('cycling_speed_and_cadence');
        const char = await service.getCharacteristic('csc_measurement');
        await char.startNotifications();
        
        let lastCrankRevs = null, lastCrankTime = null;
        char.addEventListener('characteristicvaluechanged', (e) => {
          const val = e.target.value;
          const flags = val.getUint8(0);
          if (flags & 0x02) {
            const crankRevs = val.getUint16(1, true);
            const crankTime = val.getUint16(3, true);
            if (lastCrankTime !== null) {
              let revDiff = crankRevs - lastCrankRevs;
              let timeDiff = (crankTime - lastCrankTime) / 1024;
              if (revDiff < 0) revDiff += 65536;
              if (timeDiff < 0) timeDiff += 64;
              if (timeDiff > 0) rpm = Math.round((revDiff / timeDiff) * 60);
            }
            lastCrankRevs = crankRevs;
            lastCrankTime = crankTime;
          }
        });
        alert("Connected!");
      } catch (err) {
        alert("BLE Error: " + err.message
