<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Paperboy Anime Roguelike</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; background: #87CEEB; }
    
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .card {
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: bold;
      color: #2c3e50;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .controls {
      pointer-events: auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    .btn-col { display: flex; flex-direction: column; gap: 8px; }
    .btn-row { display: flex; gap: 8px; }

    button {
      pointer-events: auto;
      padding: 12px 16px;
      border-radius: 20px;
      border: 2px solid #fff;
      background: #2ec4b6;
      color: white;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
    }

    .btn-pedal { background: #ff9f1c; padding: 16px 20px; font-size: 15px; }
    .btn-throw { background: #e71d36; padding: 16px 20px; font-size: 15px; }

    #logConsole {
      position: absolute;
      top: 70px;
      left: 16px;
      right: 16px;
      height: 180px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #38bdf8;
      border-radius: 10px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 11px;
      padding: 10px;
      overflow-y: auto;
      display: none;
      z-index: 20;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <div class="hud">
      <div class="card">❤️ HP: <span id="hp">3</span> | ⭐ <span id="score">00000</span></div>
      <div class="card">🚴 <span id="rpm">0</span> RPM</div>
    </div>

    <div class="controls">
      <div class="btn-col">
        <button onclick="connectBLE()">🚲 CONNECT SENSOR</button>
        <button onclick="toggleLogs()">📋 BLE LOGS</button>
      </div>
      <div class="btn-row">
        <button class="btn-pedal" onclick="manualPedal()">PEDAL</button>
        <button class="btn-throw" onclick="throwPaper()">THROW</button>
      </div>
    </div>
  </div>

  <div id="logConsole">
    <div>> Debug Console Ready.</div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const logConsole = document.getElementById('logConsole');

      let hp = 3, score = 0, rpm = 0, distance = 0;
      let playerX = 0;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function log(msg) {
        const line = document.createElement('div');
        line.innerText = '> ' + msg;
        logConsole.appendChild(line);
        logConsole.scrollTop = logConsole.scrollHeight;
      }

      window.toggleLogs = function() {
        logConsole.style.display = logConsole.style.display === 'block' ? 'none' : 'block';
      };

      window.manualPedal = function() {
        rpm = Math.min(130, rpm + 15);
      };

      window.throwPaper = function() {
        score += 100;
        document.getElementById('score').innerText = String(score).padStart(5, '0');
      };

      window.connectBLE = async function() {
        log('Starting Bluetooth scan...');
        try {
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ['cycling_speed_and_cadence']
          });
          log('Device selected: ' + device.name);
          const server = await device.gatt.connect();
          log('Connected to GATT Server.');
          const service = await server.getPrimaryService('cycling_speed_and_cadence');
          const char = await service.getCharacteristic('csc_measurement');
          await char.startNotifications();
          log('Subscribed to RPM data!');

          let lastCrankRevs = null, lastCrankTime = null;
          char.addEventListener('characteristicvaluechanged', (e) => {
            const val = e.target.value;
            const flags = val.getUint8(0);
            if (flags & 0x02) {
              const crankRevs = val.getUint16(1, true);
              const crankTime = val.getUint16(3, true);
              if (lastCrankTime !== null) {
                let revDiff = crankRevs - lastCrankRevs;
                let timeDiff = (crankTime - lastCrankTime) / 1024;
                if (revDiff < 0) revDiff += 65536;
                if (timeDiff < 0) timeDiff += 64;
                if (timeDiff > 0) rpm = Math.round((revDiff / timeDiff) * 60);
              }
              lastCrankRevs = crankRevs;
              lastCrankTime = crankTime;
            }
          });
        } catch (err) {
          log('BLE Error: ' + err.message);
        }
      };

      // Cadence decay loop
      setInterval(() => {
        rpm = Math.max(0, rpm - 2);
        distance += rpm * 0.05;
        document.getElementById('rpm').innerText = Math.round(rpm);
      }, 150);

      // Render Loop
      function render() {
        // Sky
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(0, 0, canvas.width, canvas.height * 0.45);

        // Grass
        ctx.fillStyle = '#94d2bd';
        ctx.fillRect(0, canvas.height * 0.45, canvas.width, canvas.height * 0.55);

        // Road
        ctx.fillStyle = '#e9d8a6';
        ctx.beginPath();
        ctx.moveTo(canvas.width * 0.48, canvas.height * 0.45);
        ctx.lineTo(canvas.width * 0.52, canvas.height * 0.45);
        ctx.lineTo(canvas.width * 0.85, canvas.height);
        ctx.lineTo(canvas.width * 0.15, canvas.height);
        ctx.fill();

        // Center line
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.setLineDash([20, 20]);
        ctx.lineDashOffset = -distance % 40;
        ctx.moveTo(canvas.width * 0.5, canvas.height * 0.45);
        ctx.lineTo(canvas.width * 0.5, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        requestAnimationFrame(render);
      }

      render();
    });
  </script>
</body>
</html>
