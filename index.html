<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Turbo Paperboy 16</title>
  <style>
    * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Courier New', monospace; background: #240046; }
    
    #gameCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      background: #240046;
    }

    .ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      z-index: 10;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .card {
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #00ffff;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: bold;
      color: #00ffff;
      font-size: 14px;
      text-shadow: 2px 2px #000;
      box-shadow: 0 0 10px rgba(0,255,255,0.4);
    }

    .controls {
      pointer-events: auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    button {
      pointer-events: auto;
      padding: 14px 20px;
      border-radius: 8px;
      border: 2px solid #fff;
      background: #7928ca;
      color: white;
      font-weight: bold;
      font-size: 14px;
      font-family: 'Courier New', monospace;
      box-shadow: 0 4px 0 #3a125c;
      cursor: pointer;
    }
    button:active { transform: translateY(4px); box-shadow: 0 0 0 #3a125c; }
    .btn-pedal { background: #ff0055; box-shadow: 0 4px 0 #88002d; font-size: 16px; padding: 18px 28px; }

    .modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      z-index: 100;
      color: #00ffff;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 20px;
    }
    .modal h1 { color: #ff0055; font-size: 28px; margin-bottom: 15px; text-shadow: 3px 3px #000; }
    .modal p { font-size: 16px; margin: 8px 0; color: #fff; }
    .modal button { margin-top: 20px; background: #00ffff; color: #000; border: 2px solid #fff; font-size: 16px; }
  </style>
</head>
<body>

  <audio id="bgm" loop preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2ec2eSa0mJmS13Z56q6m1Z1XGvE76uWvF9/S17P7/2zS0pVV6bY37DZuVvZyqZ9Z26b1c+s6+uM4JzQ0+jWu/X8q9fN7vvv97Ww4+m/u/9+ZlBXVr+v5N6qocnU2N221qef+eX89//v47a97/7///+6m6qqkXzO/97ZtqK0z9bb++P78vzq//+3pe7n/+7c5J5RUVFRUVFRUVFRUVFRUWdnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dn" type="audio/wav">
  </audio>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <div class="hud">
      <div class="card">❤️ <span id="hp">3</span> | ⭐ <span id="score">00000</span><br>⏱️ <span id="timer">60</span>s</div>
      <div class="card">🚴 <span id="rpm">50</span> RPM<br><span id="powerupStatus" style="color:#ff00ff"></span></div>
    </div>

    <div class="controls">
      <button onclick="connectBLE()">🚲 SENSOR</button>
      <button class="btn-pedal" onclick="manualPedal()">PEDAL</button>
    </div>
  </div>

  <div id="recapModal" class="modal">
    <h1>ROUTE COMPLETE!</h1>
    <p>Final Score: <span id="finalScore">0</span></p>
    <p>Deliveries Hit: <span id="finalHits">0</span> / <span id="finalTotal">0</span></p>
    <p>Accuracy: <span id="finalAccuracy">0%</span></p>
    <button onclick="restartGame()">RIDE AGAIN</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const bgm = document.getElementById('bgm');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let score = 0, rpm = 50, distance = 0;
    let gameTime = 60;
    let gameOver = false;
    let totalHousesSpawned = 0;
    let successfulHits = 0;

    let homingCharges = 0;
    let doublePointsTimer = 0;

    let isAiming = false;
    let startTouch = { x: 0, y: 0 };
    let currentTouch = { x: 0, y: 0 };

    // Air Zonk-inspired TurboGrafx-16 Chiptune Engine
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let musicInterval = null;

    function startMusic() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      bgm.volume = 0.4;
      bgm.play().catch(e => console.log("Audio play deferred:", e));

      if (musicInterval) return;
